# The split between the front end and the back end is closed by one rule here.
# The browser only ever talks to this server; /api is forwarded to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: every unknown path is a client-side route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Resolve the backend when a request arrives, not when nginx starts.
    # Otherwise nginx refuses to boot if the backend is a second slower than it is.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Review photos: three per review at up to 3 MB each. nginx defaults to 1 MB,
        # which would reject an upload before the backend ever saw it.
        client_max_body_size 12m;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
