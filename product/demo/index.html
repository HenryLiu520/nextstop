<style>

.k{font-size:11px;color:#6B655C}
.pl{font-size:13.5px;font-weight:600;margin-left:auto}
.cur{padding:15px 15px 13px 20px;border-color:#D9D0BE}
.cur .t{font-size:26px;letter-spacing:-.01em}

.now{font-size:11px;color:#6B655C;margin-top:4px;letter-spacing:.04em}
.dot{width:6px;height:6px;border-radius:50%;background:#C8452D;display:inline-block;margin-left:7px;vertical-align:middle}
.btn{height:34px;padding:0 20px;border-radius:999px;font-size:12.5px;letter-spacing:.05em;background:#fff;
     color:#1C1A17;border:1px solid #1C1A17;display:inline-flex;align-items:center;justify-content:center;
     font-family:inherit;line-height:1;cursor:pointer;user-select:none;transition:.15s}
.btn:active{transform:scale(.97)}

.rowbtn{display:flex;gap:9px;margin-top:10px;align-items:center;flex-wrap:wrap}
.todo{border-style:dotted;border-width:1.5px;border-color:#BDB4A4;background:transparent}
.done{opacity:.34}

.end{display:flex;gap:9px;justify-content:center;margin-top:22px}
nav{height:56px;border-top:1px solid #E2DCCF;display:flex;align-items:center;background:#FAF7F2;flex:0 0 auto}
nav .tab{flex:1;text-align:center;font-size:11.5px;color:#9A9285;letter-spacing:.1em;position:relative;
         padding-top:2px;cursor:pointer;height:100%;display:flex;align-items:center;justify-content:center}
nav .tab.on{color:#1C1A17}
nav .tab.on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:4px;height:4px;border-radius:50%;background:#C8452D}
#toast{position:absolute;left:16px;right:16px;bottom:66px;background:#fff;border:1px solid #E2DCCF;border-radius:12px;
       padding:11px 14px;font-size:11.5px;color:#1C1A17;display:none;align-items:center;gap:10px;
       box-shadow:0 6px 20px rgba(60,50,35,.10);z-index:30;flex-wrap:wrap}
#toast b{font-weight:600}
#toast .undo{margin-left:auto;color:#C8452D;cursor:pointer;letter-spacing:.04em}
#toast .alt{color:#8C8478;cursor:pointer;font-size:10.5px;border-bottom:1px solid #E2DCCF}
#veil{position:absolute;inset:0;background:rgba(28,26,23,.28);display:none;z-index:40}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#FAF7F2;border-radius:18px 18px 0 0;
       padding:20px 20px 26px;display:none;z-index:41;max-height:76%;overflow-y:auto}
#sheet h3{font-size:13px;font-weight:600;letter-spacing:.05em;margin-bottom:14px;color:#1C1A17}

.sheetrow{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{font-size:11.5px;color:#6B655C;border:1px dashed #D8D0C2;border-radius:999px;padding:8px 14px;cursor:pointer}
.chip:active{background:#F3EFE6}
textarea{width:100%;border:1px solid #E2DCCF;border-radius:12px;background:#fff;padding:12px 14px;
         font-family:inherit;font-size:13px;color:#1C1A17;resize:none;height:70px;outline:none}
h2{font-size:17px;font-weight:600;margin:6px 0 4px}

               font-size:12.5px;text-align:right;color:#1C1A17;outline:none}
.learned{font-size:10.5px;color:#8C8478;margin-top:6px;letter-spacing:.03em}

        display:flex;align-items:baseline;gap:8px}
.dl .bx b{font-weight:600;margin-left:auto;font-size:11.5px;color:#6B655C}

<script>
/* ================= i18n ================= */
const STR = {

  mine:{en:'Mine',zh:'我的',tw:'我的'},

  endedSub:{en:'Thursdays usually end at 20:00 · still learning you',zh:'周四 一般 20:00 结束 · 还在学你',tw:'週四 一般 20:00 結束 · 還在學你'},
  keepGoing:{en:'Not yet',zh:'还早，继续',tw:'還早，繼續'},
  planTitle:{en:'Plan',zh:'规划',tw:'規劃'},
  planSub:{en:'Pick a day, then say one sentence. Empty time defaults to study.',
           zh:'点一天，然后说一句。空着的时间默认是自习。',
           tw:'點一天，然後說一句。空著的時間預設是自習。'},
  addManual:{en:'+ Add manually',zh:'＋ 手动添加',tw:'＋ 手動新增'},
  previewBtn:{en:'Preview',zh:'预览',tw:'預覽'},
  applyBtn:{en:'Apply',zh:'应用',tw:'套用'},
  placeholder:{en:'e.g. make tomorrow afternoon study time, back in the lab by 3',
               zh:'比如：明天下午排成自习，三点前回实验室',
               tw:'比如：明天下午排成自習，三點前回實驗室'},
  previewSaid:{en:'What it did (preview)',zh:'它做了什么（预览）',tw:'它做了什麼（預覽）'},
  previewNothing:{en:'Say something first',zh:'先说一句要改什么',tw:'先說一句要改什麼'},
  previewLine:{en:'Tomorrow 13:00–14:40 study → KB 227<br>ends 14:50 (10 min to walk)<br>everything else untouched',
               zh:'明天 13:00–14:40 自习 → KB 227<br>移到 14:50 结束（留 10 分钟走）<br>其余不动',
               tw:'明天 13:00–14:40 自習 → KB 227<br>移到 14:50 結束（留 10 分鐘走）<br>其餘不動'},
  applyToast:{en:'Planned for tomorrow · one block changed',zh:'已排到明天 · 改了一站',tw:'已排到明天 · 改了一站'},
  mineTitle:{en:'Mine',zh:'我的',tw:'我的'},
  mineSub:{en:'Everything it learns is a default, never a control taken away.',
           zh:'它学到的全是默认值，不是被拿走的按钮。',
           tw:'它學到的全是預設值，不是被拿走的按鈕。'},
  walkSpeed:{en:'Walking speed',zh:'走路速度',tw:'走路速度'},
  thuEnds:{en:'Thursdays usually end',zh:'周四一般几点结束',tw:'週四一般幾點結束'},
  favPlace:{en:'Usual lunch spot',zh:'常去的吃饭点',tw:'常去的吃飯點'},
  save:{en:'Save',zh:'保存',tw:'儲存'},
  saved:{en:'Saved · it will use this from now on',zh:'已保存 · 它以后按这个来',tw:'已儲存 · 它以後按這個來'},
  startAt:{en:'Start the day at',zh:'今天从几点开始',tw:'今天從幾點開始'},
  endAt:{en:'Plan the day until',zh:'今天排到几点',tw:'今天排到幾點'},
  moveEarlier:{en:'30 min earlier',zh:'提前 30 分钟',tw:'提前 30 分鐘'},
  moveEarlier15:{en:'15 min earlier',zh:'提前 15 分钟',tw:'提前 15 分鐘'},
  moveLater15:{en:'15 min later',zh:'推后 15 分钟',tw:'推後 15 分鐘'},
  moveLater:{en:'30 min later',zh:'推后 30 分钟',tw:'推後 30 分鐘'},
  skipThis:{en:'Skip this class',zh:'跳过这节课',tw:'跳過這節課'},
  skipNote:{en:'the hour becomes study time',zh:'时间用自习填上',tw:'時間用自習填上'},
  changePlace:{en:'Change place',zh:'换地方',tw:'換地方'},
  bookThis:{en:'Book this room',zh:'一键预约',tw:'一鍵預約'},
  removeItem:{en:'Remove this item',zh:'删掉这一项',tw:'刪掉這一項'},
  swapped:{en:'Moved to <b>{p}</b> · only this block changed',zh:'已换到 <b>{p}</b> · 只改了这一站',tw:'已換到 <b>{p}</b> · 只改了這一站'},
  undo:{en:'Undo',zh:'撤回',tw:'撤回'},
  skipped:{en:'Skipped · that time is now study',zh:'这节课不去了 · 这段时间当自习用',tw:'這節課不去了 · 這段時間當自習用'},
  endedToast:{en:'That is the day · Thursdays usually end at 20:00',zh:'今天到这儿 · 周四一般 20:00 结束',tw:'今天到這兒 · 週四一般 20:00 結束'},
  extended:{en:'Extended to <b>{t}</b> · it learns you stay longer',zh:'延到 <b>{t}</b> · 学到你会待更久',tw:'延到 <b>{t}</b> · 學到你會待更久'},
  repairToast:{en:'One block changed · the rest untouched (ends {t})',zh:'改了一站 · 其余不变（{t} 结束）',tw:'改了一站 · 其餘不變（{t} 結束）'},
  seeRecompute:{en:'see full recompute',zh:'看看全部重算会怎样',tw:'看看全部重算會怎樣'},
  recomputeToast:{en:'Full recompute: <b>{n}</b> blocks changed',zh:'全部重算：改了 <b>{n}</b> 站',tw:'全部重算：改了 <b>{n}</b> 站'},
  bookedToast:{en:'Booked <b>LIB 3/F Room 2</b> · 16:00–16:50',zh:'已订 <b>LIB 3/F 讨论室 2</b> · 16:00–16:50',tw:'已訂 <b>LIB 3/F 討論室 2</b> · 16:00–16:50'},
  unbookToast:{en:'Booking cancelled',zh:'已取消预约',tw:'已取消預約'},
  cancelBooking:{en:'Cancel',zh:'取消',tw:'取消'},
  pastToast:{en:'That block is already gone',zh:'这一项已经过去了',tw:'這一項已經過去了'},
  addTitle:{en:'Add manually',zh:'手动添加',tw:'手動新增'},
  add:{en:'Add',zh:'添加',tw:'新增'},
  addToast:{en:'Added <b>{t}</b> · gaps filled with study',zh:'加了 <b>{t}</b> · 空档已用自习填好',tw:'加了 <b>{t}</b> · 空檔已用自習填好'},
  close:{en:'Close',zh:'关闭',tw:'關閉'},
  readOnly:{en:'only today can be edited',zh:'只有今天能改',tw:'只有今天能改'}
};
let LANG = 'en';
const t = (k, vars) => {
  let s = (STR[k] && (STR[k][LANG] || STR[k].en)) || k;
  if (vars) for (const kk in vars) s = s.replace('{' + kk + '}', vars[kk]);
  return s;
};
const PLACE = {
  kb227:{en:'KB 227',zh:'KB 227',tw:'KB 227'},
  lib3f:{en:'LIB 3/F',zh:'LIB 3/F',tw:'LIB 3/F'},
  cym:{en:'Chong Yuet Ming',zh:'庄月明',tw:'莊月明'},
  cpdlg05:{en:'CPD · LG05',zh:'CPD · LG05',tw:'CPD · LG05'},
  chihwah:{en:'Chi Wah B1',zh:'智华馆 B1',tw:'智華館 B1'},
  union:{en:'Student Union',zh:'学生会食堂',tw:'學生會食堂'},
  kb315:{en:'KB 315',zh:'KB 315',tw:'KB 315'},
  kb221:{en:'KB 221',zh:'KB 221',tw:'KB 221'},
  tbd:{en:'TBD',zh:'待定',tw:'待定'},
  nearby:{en:'Study nearby',zh:'就近自习',tw:'就近自習'},
  room2:{en:'LIB 3/F Room 2',zh:'LIB 3/F 讨论室 2',tw:'LIB 3/F 討論室 2'}
};
const P = k => (PLACE[k] && (PLACE[k][LANG] || PLACE[k].en)) || k;

/* ================= state ================= */
const S = {
  tab:'day',
  learned:{walk:1.00, endThu:'18:20'},
  started:'09:00', ends:'18:20', ended:false,
  stops:[
    {id:1,type:'class',start:'09:00',end:'10:50',place:'kb227',status:'done'},
    {id:2,type:'study',start:'11:00',end:'12:00',place:'kb227',status:'now'},
    {id:3,type:'eat',start:'12:10',end:'12:40',place:'cym',status:'todo'},
    {id:4,type:'class',start:'14:00',end:'15:50',place:'cpdlg05',status:'planned'},
    {id:5,type:'meet',start:'16:00',end:'16:50',place:'tbd',status:'planned',booking:'none'},
    {id:6,type:'study',start:'17:00',end:'18:20',place:'lib3f',status:'planned'}
  ],
  gaps:['walk:5','walk:10','walk:10','walk:10']
};
const COLORS={class:'#1C1A17',study:'#2F5D9E',eat:'#B4763A',meet:'#6A4C93'};
const EAT_POOL=['cym','chihwah','union','kb221','lib3f','chihwah'];
let eatIdx=0, nextId=100, batchCount=0, addType='study';
let WEEK=[], selDay=3;

/* ================= helpers ================= */
const main=document.getElementById('main');
const mins=t2=>{const [h,m]=t2.split(':').map(Number);return h*60+m;};
function shift(t2,d){let x=mins(t2)+d;x=Math.max(0,x);
  return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');}
function r10(t2){const m=Math.round(mins(t2)/10)*10;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
const typeName=s=> s.type==='class'?t('typeClass') : s.type==='study'?t('typeStudy') :
                    s.type==='eat'?t('typeEat') : t('typeMeet');
const sortStops=()=>S.stops.sort((a,b)=>a.start.localeCompare(b.start));
const WALK=8;

function fillGaps(){
  sortStops();
  const live=S.stops.filter(s=>s.status!=='dropped'&&s.status!=='skipped');
  for(let i=1;i<live.length;i++){
    const prev=live[i-1],next=live[i];
    const free=mins(next.start)-mins(prev.end)-WALK;
    if(free<10) continue;
    if(prev.type==='study'||prev.type==='eat'){ prev.end=r10(shift(next.start,-WALK)); }
    else{
      const st=r10(shift(prev.end,WALK)), en=r10(shift(next.start,-WALK));
      if(mins(en)-mins(st)>=10) S.stops.push({id:nextId++,type:'study',start:st,end:en,place:'nearby',status:'planned'});
    }
  }
  sortStops();
  const now=S.stops.filter(s=>s.status!=='dropped');
  S.gaps=[]; for(let i=1;i<now.length;i++){
    const w=Math.max(5,Math.round((mins(now[i].start)-mins(now[i-1].end))/5)*5);
    S.gaps.push('walk:'+w);
  }
}

/* ================= render: day ================= */
function block(s){
  if(s.status==='skipped')
    return `<div class="blk done" style="padding:9px 14px 9px 18px">
      <div class="bar" style="background:#BDB4A4"></div>
      <div class="row"><span class="t" style="font-size:12.5px">${s.start}–${s.end}</span>
      <span class="k">${typeName(s)}</span><span class="pl" style="font-weight:400;font-size:12px">${t('skip')}</span></div></div>`;
  const isNow=s.status==='now';
  const cls=['blk',isNow?'cur':'',s.status==='todo'?'todo':'',s.status==='done'?'done':''].filter(Boolean).join(' ');
  let acts='';
  if(s.status!=='done'){
    if(s.type==='class') acts=`<span class="btn" onclick="skipStop(${s.id})">${t('skip')}</span>`;
    else if(s.type==='eat'||s.type==='study') acts=`<span class="btn" onclick="swapStop(${s.id})">${t('swap')}</span>`;
    else if(s.type==='meet') acts = s.booking==='done'
      ? `<span class="btn state">${t('booked')} · ${P('room2')}</span><span class="btn" onclick="unbook(${s.id})">${t('cancelBooking')}</span>`
      : (s.booking==='booking' ? `<span class="btn state">${t('booking')}</span>`
        : `<span class="btn" onclick="bookStop(${s.id})">${t('book')}</span><span class="btn state">${t('booked')}</span>`);
  }
  const nowLine = isNow ? `<div class="now">${t('here',{t:s.end})}</div>` : '';
  return `<div class="${cls}" onclick="blockSheet(${s.id},event)">
    <div class="bar" style="background:${COLORS[s.type]}"></div>
    <div class="row"><span class="t">${s.start}–${s.end}</span><span class="k">${typeName(s)}</span>
      <span class="pl">${P(s.place)}${isNow?'<span class="dot"></span>':''}</span></div>
    ${nowLine}${acts?`<div class="rowbtn">${acts}</div>`:''}</div>`;
}
function gapText(g){
  if(g && g.indexOf('walk:')===0) return t('walk',{n:g.split(':')[1]});
  return '';
}
function renderDay(){
  if(S.ended){
    main.innerHTML=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:.85">
      <div style="font-size:15px">${t('ended')}</div>
      <div style="font-size:11.5px;color:#6B655C;letter-spacing:.04em">${t('endedSub')}</div>
      <span class="btn" onclick="unEnd()">${t('keepGoing')}</span></div>`;
    return;
  }
  let h='';
  S.stops.forEach((s,i)=>{
    if(s.status==='dropped') return;
    if(i>0 && S.gaps[i-1]) h+=`<div class="gap">${gapText(S.gaps[i-1])}</div>`;
    h+=block(s);
  });
  h+=`<div class="end"><span class="btn" onclick="endDay()">${t('endDay')}</span>
      <span class="btn" onclick="extend()">${t('stay')}</span></div>`;
  main.innerHTML=h;
}

/* ================= render: plan ================= */
function todayRows(){
  return S.stops.filter(s=>s.status!=='dropped').map(s=>[s.start,s.end,s.type,s.place]);
}
function buildWeek(){
  const row=(a,b,ty,pl)=>[a,b,ty,pl];
  WEEK=[
    {dw:{en:'Mon',zh:'一',tw:'一'},dn:'27',label:{en:'Monday · 27 Oct',zh:'周一 · 10 月 27 日',tw:'週一 · 10 月 27 日'},
      rows:[row('09:00','10:50','class','kb227'),row('11:00','12:00','study','kb227'),row('13:00','14:00','study','lib3f'),row('14:00','15:50','class','cpdlg05'),row('16:00','17:30','study','lib3f')]},
    {dw:{en:'Tue',zh:'二',tw:'二'},dn:'28',label:{en:'Tuesday · 28 Oct',zh:'周二 · 10 月 28 日',tw:'週二 · 10 月 28 日'},
      rows:[row('10:00','11:50','class','kb227'),row('12:00','13:00','eat','union'),row('14:00','15:50','meet','lib3f'),row('16:00','18:00','study','kb315')]},
    {dw:{en:'Wed',zh:'三',tw:'三'},dn:'29',label:{en:'Wednesday · 29 Oct',zh:'周三 · 10 月 29 日',tw:'週三 · 10 月 29 日'},
      rows:[row('09:00','10:50','class','kb227'),row('11:00','11:50','study','kb221'),row('12:10','12:40','eat','cym'),row('14:00','15:50','class','cpdlg05'),row('16:00','17:00','study','lib3f')]},
    {dw:{en:'Thu',zh:'四',tw:'四'},dn:'30',label:{en:'Thursday · 30 Oct (today)',zh:'周四 · 10 月 30 日（今天）',tw:'週四 · 10 月 30 日（今天）'},rows:null},
    {dw:{en:'Fri',zh:'五',tw:'五'},dn:'31',label:{en:'Friday · 31 Oct',zh:'周五 · 10 月 31 日',tw:'週五 · 10 月 31 日'},
      rows:[row('09:00','10:50','class','kb227'),row('11:00','12:30','study','lib3f'),row('13:00','14:00','eat','chihwah'),row('15:00','16:00','study','lib3f')]}
  ];
}
const rowsOf=i=> i===3 ? todayRows() : WEEK[i].rows;
const typeLabel=ty=> ty==='class'?t('typeClass'):ty==='study'?t('typeStudy'):ty==='eat'?t('typeEat'):t('typeMeet');

function renderPlan(){
  if(!WEEK.length) buildWeek();
  const rows=rowsOf(selDay);
  main.innerHTML=`
    <h2>${t('planTitle')}</h2>
    <div class="sub">${t('planSub')}</div>
    <div class="week">
      ${WEEK.map((x,i)=>`<div class="dcol ${i===selDay?'on':''}" onclick="selDay=${i};renderPlan()">
        <div class="dw">${x.dw[LANG]||x.dw.en}</div><div class="dn">${x.dn}</div>
        <div class="bars">${rowsOf(i).slice(0,6).map(r=>`<i class="${{class:'k',study:'s',eat:'e',meet:'m'}[r[2]]}"></i>`).join('')}</div>
      </div>`).join('')}
    </div>
    <div class="dayhdr">${WEEK[selDay].label[LANG]||WEEK[selDay].label.en}</div>
    ${selDay===3
      ? `<div class="bounds">${t('todayFrom')} <span class="tappill" onclick="pickTime('start')">${S.started}</span>
         · ${t('until')} <span class="tappill" onclick="pickTime('ends')">${S.ends}</span></div>`
      : `<div class="bounds" style="opacity:.6">${t('readOnly')} · ${S.started}–${S.ends}</div>`}
    ${rows.map(r=>`<div class="dl" onclick="planRow('${r[0]}')">
        <div class="hh">${r[0]}</div>
        <div class="bx">${typeLabel(r[2])}<span class="tm">→ ${r[1]}</span><b>${P(r[3])}</b></div></div>`).join('')}
    <div style="margin-top:10px"><span class="btn" onclick="addSheet()">${t('addManual')}</span></div>
    <div id="planBox"><textarea id="inp" placeholder="${t('placeholder')}"></textarea>
    <div class="preview" id="pv"></div>
    <div class="sheetrow"><span class="btn" onclick="planPreview()">${t('previewBtn')}</span>
    <span class="btn" id="applyBtn" style="display:none" onclick="planApply()">${t('applyBtn')}</span></div></div>`;
}

/* ================= render: mine ================= */
function renderMine(){
  const L=S.learned;
  main.innerHTML=`
    <h2>${t('mineTitle')}</h2>
    <div class="sub">${t('mineSub')}</div>
    <div class="row2"><span>${t('walkSpeed')}</span><span class="v">× <input id="pwalk" value="${L.walk.toFixed(2)}"></span></div>
    <div class="row2"><span>${t('thuEnds')}</span><span class="v"><input id="pend" value="${L.endThu}"></span></div>
    <div class="row2"><span>${t('favPlace')}</span><span class="v">${P('cym')}</span></div>
    <div class="learned">walk × ${L.walk.toFixed(2)} · 3 observations before it replaces the default</div>
    <div class="sheetrow"><span class="btn" onclick="saveParams()">${t('save')}</span></div>`;
}

function render(){
  document.getElementById('dateLine').textContent=t('date');
  document.getElementById('tab-day').textContent=t('day');
  document.getElementById('tab-plan').textContent=t('plan');
  document.getElementById('tab-mine').textContent=t('mine');
  document.getElementById('langs').innerHTML=['en','zh','tw'].map(l=>
    `<span class="${l===LANG?'on':''}" onclick="setLang('${l}')">${{en:'EN',zh:'简',tw:'繁'}[l]}</span>`).join('');
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===S.tab));
  document.getElementById('hintBtn').style.display = S.tab==='day' ? '' : 'none';
  document.getElementById('hintBtn').textContent=t('changed');
  if(S.tab==='day') renderDay(); else if(S.tab==='plan') renderPlan(); else renderMine();
}
function setLang(l){ LANG=l; render(); }
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{S.tab=x.dataset.tab;render();});

/* ================= toast / sheet ================= */
let toastTimer=null;
function toast(msg,undoCb,altCb,altText){
  const el=document.getElementById('toast');
  el.innerHTML=`<span>${msg}</span>`+(altCb?`<span class="alt" id="altBtn">${altText}</span>`:'')+
               (undoCb?`<span class="undo" id="undoBtn">${t('undo')}</span>`:'');
  el.style.display='flex';
  if(undoCb) document.getElementById('undoBtn').onclick=()=>{hideToast();undoCb();};
  if(altCb) document.getElementById('altBtn').onclick=()=>{hideToast();altCb();};
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,6000);
}
const hideToast=()=>document.getElementById('toast').style.display='none';
function showSheet(html){const s=document.getElementById('sheet'),v=document.getElementById('veil');
  s.innerHTML=html;s.style.display='block';v.style.display='block';}
function closeSheet(){document.getElementById('sheet').style.display='none';document.getElementById('veil').style.display='none';}
document.getElementById('veil').onclick=closeSheet;

/* ================= actions ================= */
function blockSheet(id,ev){
  if(ev&&ev.target.closest('.btn')) return;
  if(ev) ev.stopPropagation();
  const s=S.stops.find(x=>x.id===id);
  if(s.status==='done'){ toast(t('pastToast')); return; }
  let rows='';
  if(s.type==='class'){
    rows=`<div class="trow" onclick="skipStop(${id})">${t('skipThis')}<span style="color:#9A9285">${t('skipNote')}</span></div>`+
      [[-30,'moveEarlier'],[-15,'moveEarlier15'],[15,'moveLater15'],[30,'moveLater']].map(([d,k])=>
        `<div class="trow" onclick="moveStop(${id},${d})">${t(k)}<span style="color:#9A9285">${shift(s.start,d)}</span></div>`).join('');
  } else if(s.type==='eat'){
    rows=`<div class="trow" onclick="closeSheet();swapStop(${id})">${t('changePlace')}<span style="color:#9A9285">${P(s.place)}</span></div>`+
      [[-15,'moveEarlier15'],[15,'moveLater15'],[30,'moveLater']].map(([d,k])=>
        `<div class="trow" onclick="moveStop(${id},${d})">${t(k)}<span style="color:#9A9285">${shift(s.start,d)}</span></div>`).join('');
  } else if(s.type==='study'){
    rows=`<div class="trow" onclick="closeSheet();swapStop(${id})">${t('changePlace')}<span style="color:#9A9285">${P(s.place)}</span></div>`;
  } else {
    rows=`<div class="trow" onclick="closeSheet();bookStop(${id})">${t('bookThis')}<span style="color:#9A9285">${P(s.place)}</span></div>`+
      `<div class="trow" onclick="closeSheet();swapStop(${id})">${t('changePlace')}</div>`+
      [[-15,'moveEarlier15'],[15,'moveLater15']].map(([d,k])=>
        `<div class="trow" onclick="moveStop(${id},${d})">${t(k)}<span style="color:#9A9285">${shift(s.start,d)}</span></div>`).join('');
  }
  rows+=`<div class="trow" onclick="dropStop(${id})">${t('removeItem')}</div>`;
  showSheet(`<h3>${s.start}–${s.end} · ${typeName(s)}</h3><div class="tlist">${rows}</div>`+
    `<div class="sheetrow"><span class="btn" onclick="closeSheet()">${t('cancel')}</span></div>`);
}
function planRow(start){
  const s=S.stops.find(x=>x.start===start);
  if(s){ blockSheet(s.id); return; }
  const r=(WEEK[selDay].rows||[]).find(x=>x[0]===start);
  if(r) showSheet(`<h3>${r[0]}–${r[1]} · ${typeLabel(r[2])}</h3>`+
    `<div class="tlist"><div class="trow">${P(r[3])}<span style="color:#9A9285">${WEEK[selDay].label[LANG]||WEEK[selDay].label.en}</span></div></div>`+
    `<div class="sheetrow"><span class="btn" onclick="closeSheet()">${t('close')}</span></div>`);
}
function swapStop(id){
  const s=S.stops.find(x=>x.id===id);
  const pool=s.type==='eat' ? EAT_POOL : ['kb221','kb315','lib3f','chihwah','cym'];
  showSheet(`<h3>${s.start} · ${t('swap')}</h3>`+
    pool.slice(eatIdx,eatIdx+3).map(k=>
      `<div class="opt" onclick="pickSwap(${id},'${k}')"><div class="n">${P(k)}</div>
       <div class="m">8 min · ${LANG==='en'?'same campus':'同区'}</div>
       <div class="w">${LANG==='en'?'free for the whole block':'整段都空着'}</div></div>`).join('')+
    `<div class="sheetrow"><span class="btn" onclick="nextBatch(${id})">${t('swap')}</span>
     <span class="btn" onclick="closeSheet()">${t('cancel')}</span></div>`);
}
function nextBatch(id){ batchCount++; if(batchCount>2){ closeSheet(); batchCount=0; return; }
  eatIdx=(eatIdx+3)%EAT_POOL.length; swapStop(id); }
function pickSwap(id,place){
  const s=S.stops.find(x=>x.id===id);
  const before=s.place;
  s.place=place; if(s.status==='todo') s.status='planned';
  fillGaps(); closeSheet(); render();
  toast(t('swapped',{p:P(place)}),()=>{s.place=before;fillGaps();render();hideToast();});
}
function bookStop(id){
  const s=S.stops.find(x=>x.id===id);
  s.booking='booking'; render();
  setTimeout(()=>{ s.booking='done'; s.place='room2'; s.status='planned'; render();
    toast(t('bookedToast'),()=>{s.booking='none';s.place='tbd';render();hideToast();}); },800);
}
function unbook(id){ const s=S.stops.find(x=>x.id===id); s.booking='none'; s.place='tbd'; render(); toast(t('unbookToast')); }
function skipStop(id){
  const s=S.stops.find(x=>x.id===id); const before=s.status;
  s.status='skipped'; fillGaps(); sortStops(); render();
  toast(t('skipped'),()=>{s.status=before;fillGaps();render();hideToast();});
}
function moveStop(id,d){
  const s=S.stops.find(x=>x.id===id); const bs=s.start,be=s.end;
  s.start=r10(shift(s.start,d)); s.end=r10(shift(s.end,d));
  fillGaps(); closeSheet(); render();
  toast(`${s.start}–${s.end}`,()=>{s.start=bs;s.end=be;fillGaps();render();hideToast();});
}
function dropStop(id){
  const s=S.stops.find(x=>x.id===id); const before=s.status;
  s.status='dropped'; fillGaps(); closeSheet(); render();
  toast(t('removeItem'),()=>{s.status=before;fillGaps();render();hideToast();});
}
function endDay(){ S.ended=true; render(); toast(t('endedToast'),()=>{S.ended=false;render();hideToast();}); }
function unEnd(){ S.ended=false; render(); hideToast(); }
function extend(){
  const last=S.stops[S.stops.length-1]; const before=last.end;
  last.end='18:50'; render();
  toast(t('extended',{t:'18:50'}),()=>{last.end=before;render();hideToast();});
}
function applyDeviation(lateMin){
  closeSheet();
  const now=S.stops.find(x=>x.status==='now')||S.stops[1];
  const before=now.end;
  now.end=r10(shift(now.end,-lateMin));
  render();
  toast(t('repairToast',{t:now.end}),()=>{now.end=before;render();hideToast();},
        ()=>{now.end=before;fullRecompute(lateMin);},t('seeRecompute'));
}
function fullRecompute(d){
  const idx=S.stops.findIndex(x=>x.status==='now'); let n=0;
  for(let i=idx;i<S.stops.length;i++){ if(i>idx) S.stops[i].start=shift(S.stops[i].start,-d);
    S.stops[i].end=shift(S.stops[i].end,-d); n++; }
  render(); toast(t('recomputeToast',{n}),()=>location.reload());
}
function pickTime(which){
  const cur=which==='start'?S.started:S.ends;
  const list=[]; let x='07:00'; while(mins(x)<=mins('23:00')){ list.push(x); x=shift(x,30); }
  showSheet(`<h3>${which==='start'?t('startAt'):t('endAt')}</h3><div class="tlist">`+
    list.map(v=>`<div class="trow ${v===cur?'on':''}" onclick="setBound('${which}','${v}')">${v}</div>`).join('')+
    `</div><div class="sheetrow"><span class="btn" onclick="closeSheet()">${t('cancel')}</span></div>`);
}
function setBound(which,v){ closeSheet(); if(which==='start')S.started=v; else S.ends=v; render(); }
function addSheet(){
  showSheet(`<h3>${t('addTitle')}</h3><div class="tlist">`+
    [['study','typeStudy'],['eat','typeEat'],['meet','typeMeet'],['class','typeClass']].map(([k,lab])=>
      `<div class="trow ${addType===k?'on':''}" onclick="addType='${k}';addSheet()">${t(lab)}</div>`).join('')+
    `</div><div style="display:flex;gap:8px;margin:14px 0">
      <input id="aStart" value="13:00" style="flex:1;border:1px solid #E2DCCF;border-radius:9px;padding:10px;font-family:inherit;font-size:13px">
      <input id="aEnd" value="14:00" style="flex:1;border:1px solid #E2DCCF;border-radius:9px;padding:10px;font-family:inherit;font-size:13px"></div>
     <div class="sheetrow"><span class="btn" onclick="doAdd()">${t('add')}</span>
     <span class="btn" onclick="closeSheet()">${t('cancel')}</span></div>`);
}
function doAdd(){
  const st=document.getElementById('aStart').value, en=document.getElementById('aEnd').value;
  const pl=addType==='study'?'nearby':addType==='eat'?'cym':'tbd';
  S.stops.push({id:nextId++,type:addType,start:st,end:en,place:pl,status:'planned'});
  fillGaps(); closeSheet(); render();
  setTimeout(()=>toast(t('addToast',{t:st+'–'+en}),()=>{S.stops.pop();fillGaps();render();hideToast();}),20);
}
function planPreview(){
  const v=(document.getElementById('inp').value||'').trim();
  const pv=document.getElementById('pv'); pv.style.display='block';
  pv.innerHTML=t('previewSaid')+'<br>'+(v?t('previewLine'):t('previewNothing'));
  document.getElementById('applyBtn').style.display=v?'':'none';
}
function planApply(){ document.getElementById('applyBtn').style.display='none'; toast(t('applyToast')); }
function saveParams(){
  const w=parseFloat(document.getElementById('pwalk').value);
  const e=document.getElementById('pend').value;
  if(!isNaN(w)) S.learned.walk=w;
  if(/^\d{1,2}:\d{2}$/.test(e)) S.learned.endThu=e;
  renderMine(); toast(t('saved'));
}
/* 右上角：有变化？说一句 */
(function(){
  const b=document.createElement('div');
  b.className='hint'; b.id='hintBtn'; b.textContent=t('changed');
  b.onclick=()=>{
    showSheet(`<h3>${t('changed')}</h3><div class="chips">
      <div class="chip" onclick="applyDeviation(20)">${LANG==='en'?'the class ran 20 min late':LANG==='zh'?'课拖了 20 分钟':'課拖了 20 分鐘'}</div>
      <div class="chip" onclick="applyDeviation(10)">${LANG==='en'?'I am 10 min behind':LANG==='zh'?'我晚了 10 分钟':'我晚了 10 分鐘'}</div>
      </div><div class="sheetrow"><span class="btn" onclick="closeSheet()">${t('cancel')}</span></div>`);
  };
  document.querySelector('header').appendChild(b);
})();

buildWeek();
render();
</script>
</body></html>
