<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextStop · prototype</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
  --green:#00664F;
  --deep:#00382C;
  --mint:#E6EFEA;
  --paper:#F7F4EC;
  --card:#FFFFFF;
  --line:#DDE4DF;
  --gold:#B49A5E;
  --ink:#16211D;
  --mute:#5F6B65;
  --faint:#8E9993;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  --r:6px;                          /* 块圆角，统一 6 */
  --rl:14px;                         /* 大卡片与底栏顶部圆角 */
}
body{background:var(--mint);font-family:var(--sans);font-size:11px;color:var(--ink);min-height:100vh;
     display:flex;align-items:center;justify-content:center;padding:24px}
/* 演示框：桌面留 24px 边，窄屏（≤438）自动贴边，保证画面正好 390×844 */
@media (max-width:438px){body{padding:0}}
#phone{width:390px;height:844px;flex:0 0 390px;background:var(--paper);outline:1px solid rgba(0,56,44,.10);
       border-radius:3px;overflow:hidden;display:flex;flex-direction:column;position:relative}

/* ---------- 头部：72px 短头部（米白，无照片） ----------
   【一致性】头部只有一层：校徽 + 品牌 + 日期 + 三语，字号只用 15 / 8.5 两档 */
header{flex:0 0 64px;height:64px;display:flex;align-items:center;justify-content:space-between;
       padding:0 20px;border-bottom:1px solid var(--gold);background:var(--paper);
       position:relative;z-index:2}
.hleft{display:flex;align-items:center;gap:12px;min-width:0}
.crestchip{display:block;background:transparent;border:none;flex:0 0 auto;padding:0}
img.crest{display:block;width:26px;height:29px;object-fit:contain}
/* 【接近性】品牌与日期是同一组信息：横排、基线对齐、固定 10px 级距 */
.hnames{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.brand{font-family:var(--serif);font-size:20px;line-height:1;color:var(--deep);letter-spacing:.01em;
       white-space:nowrap}
.date{font-size:10px;line-height:1;color:var(--faint);letter-spacing:.06em;
      font-variant-numeric:tabular-nums;white-space:nowrap}
.langs{display:flex;gap:4px;flex:0 0 auto}
/* 【可供性】三语是三个有边框的方块，看得出能点 */
.langs span{width:20px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid rgba(0,102,79,.38);border-radius:var(--r);font-family:var(--serif);font-size:8.5px;
  letter-spacing:.02em;color:var(--green);background:transparent;transition:.15s}
.langs span.on{background:var(--deep);border-color:var(--deep);color:#fff}

/* ---------- 内容 ---------- */
/* 【接近性 Gestalt】头部↔内容 10px；块内 4px 级距；块间 10px；组间 20px */
main{flex:1;min-height:0;overflow-y:auto;padding:10px 20px 16px;display:flex;flex-direction:column;
     scrollbar-width:none;position:relative;z-index:1}
main::-webkit-scrollbar{display:none}
main.pad{padding-bottom:16px}

/* ---------- 左侧分类色条：3px、与块齐高、圆角 0、紧贴左边缘 ----------
   自习 = HKU 绿 / 上课 = 灰蓝 / 其他（吃饭·见面·手动添加·日历导入）= 暖褐
   【一致性】三类只有三种颜色，一眼分得开，不靠字 */
.cbar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0;z-index:3;pointer-events:none}
.cbar.study{background:#00664F}
.cbar.class{background:#3F6E7A}
.cbar.other{background:#B08968}

/* ---------- 三点按钮 ⋯ ----------
   【可供性】有明确的 26px 面 + 按下底色，看得出这一格能操作
   视觉 26×26；热区 44×44（padding 9 撑开，Fitts 定律）
   44 = 9 + 26 + 9 → 26px 的视觉面正好落在块内 top 8 / right 8 */
.dots{position:absolute;top:-1px;right:-1px;width:44px;height:44px;padding:9px;border:none;
      background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;
      z-index:5;font:inherit;-webkit-tap-highlight-color:transparent}
.blk>.dots{top:-2px;right:-2px}   /* 块有 1px 边框：补偿 1px，26px 视觉面仍落在 top 8 / right 8 */
.dico{width:26px;height:26px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;
      gap:3px;background:transparent;transition:background .12s}
.dots i{display:block;width:2px;height:2px;border-radius:50%;background:#5F6B65}
.dots:active .dico{background:rgba(0,102,79,.08)}   /* 【反馈】一按就有底色 */
.focus .dots i{background:rgba(255,255,255,.85)}    /* 焦点卡上同一位置：白色 85% */
.focus .dots:active .dico{background:rgba(255,255,255,.16)}

/* ---------- 一天：260px 焦点卡（压短：整张一日清单留在第一屏） ---------- */
.focus{flex:0 0 320px;height:320px;width:100%;border-radius:var(--rl);overflow:hidden;position:relative;
       background-color:var(--deep);background-size:cover;background-position:center 35%;
       background-repeat:no-repeat;cursor:pointer}
.focus:before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(0,56,44,.04) 0%,rgba(0,56,44,.38) 58%,rgba(0,56,44,.60) 100%)}
/* 【可供性】状态标签两个都有明确边界：实心 = 现在，描边 = 下一间 */
.focus.empty{background:#EFEAE0 !important;display:flex;align-items:flex-end}
.focus.empty .froom{color:var(--ink);font-size:17px}
.fstat{position:absolute;top:12px;left:16px;z-index:2;font-size:8.5px;line-height:1;
       letter-spacing:.16em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r);font-weight:600}
.inTag{font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;margin-left:8px;vertical-align:2px;font-family:var(--sans)}
.inTag.now{background:#00664F;color:#E3C68C;font-weight:600;border:1px solid #00664F;border-radius:3px;padding:2px 5px;letter-spacing:.12em;margin-left:8px;vertical-align:2px}
.inTag.nx{color:#8E9993}
.curbox{outline:1px solid #00664F;outline-offset:-1px;border-radius:6px}
.doneTag{color:#9AA6A0 !important}
.curTag{color:#00664F !important;font-weight:600}
.fstat.now{background:#00664F;color:#E3C68C;border:1px solid #00664F;font-weight:600;border-radius:3px}
.fstat.next{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.9);font-weight:500}
.fbot{position:absolute;left:16px;bottom:16px;right:120px;z-index:2}
.fwhen{font-size:11px;letter-spacing:.02em;color:#fff;margin-top:6px}
.fwalk{font-size:8.5px;letter-spacing:.06em;color:rgba(255,255,255,.72);margin-top:4px}
.froom{font-family:var(--serif);font-size:28px;line-height:1;color:#fff;letter-spacing:.01em}
.fsub{font-size:11px;line-height:1.2;color:rgba(255,255,255,.78);margin-top:4px;letter-spacing:.04em}
.ftm{font-size:11px;line-height:1.2;color:#fff;margin-top:4px;letter-spacing:.02em;
     font-variant-numeric:tabular-nums}
.fswap{position:absolute;right:16px;bottom:16px;z-index:3;width:96px;height:32px;border-radius:var(--r);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.65);color:#fff;font-size:8.5px;
  letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;
  cursor:pointer}

/* ---------- 一天：TODAY 小标题 + 列表 ---------- */
.todaybar{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:8px;
          margin:8px 0;font-size:8.5px;line-height:1;letter-spacing:.14em;text-transform:uppercase;
          color:var(--faint)}
.todaybar .hint{font-size:8.5px;letter-spacing:.04em;text-transform:none;color:var(--mute);
                cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line);padding-bottom:1px}
.blk.h56{height:56px;flex:0 0 56px;padding:8px 40px 8px 16px}
.blk.bar{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:0 40px 0 16px}
.blk.b40{height:40px;flex:0 0 40px}
.blk.b36{height:36px;flex:0 0 36px}
.blk.bar .bl{display:flex;align-items:baseline;gap:8px;min-width:0}
.blk.bar .bt{font-size:8.5px;line-height:1;letter-spacing:.1em;text-transform:uppercase;
             color:var(--faint);white-space:nowrap}
.blk.bar .bn{font-size:11px;line-height:1;color:var(--deep);letter-spacing:.02em;white-space:nowrap}
.blk.bar .br{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.blk.bar .br .tt{font-family:var(--serif);font-size:11px;line-height:1;color:var(--mute);
                 letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 【一致性】所有块同一套圆角 3、同一套右边距 40（给三点按钮让位）、同一套字号 */
.blk{flex:0 0 auto;position:relative;display:flex;flex-direction:column;justify-content:center;
     background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 40px 12px 16px;
     cursor:pointer;transition:.12s;overflow:hidden;font-variant-numeric:tabular-nums}
.blk+.blk{margin-top:10px}
.blk.grp{margin-top:20px}
.blk:active{background:#FBF9F3}   /* 【反馈】按下即变 */
.b1{font-size:13.5px;line-height:1.15;color:var(--deep);letter-spacing:.01em}
.b2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.t{font-family:var(--serif);font-size:11px;color:var(--mute);letter-spacing:.02em}
.w{font-size:8.5px;color:var(--faint);letter-spacing:.03em;white-space:nowrap}
.tag{position:absolute;top:12px;right:40px;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
     color:var(--faint);line-height:1}
.done{opacity:.55}
.skipped{opacity:.45}

/* 块内小按钮（预约） */
.bkit{width:92px;height:26px;flex:0 0 92px;border:1px solid var(--green);border-radius:var(--r);
      color:var(--green);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;
      align-items:center;justify-content:center;background:#fff;line-height:1;text-align:center}
.bkit.doneb{color:var(--faint);border-color:var(--line);border-style:dashed}

/* ---------- 底部固定区 ---------- */
.dock{position:relative;flex:0 0 auto;display:none;border-top:1px solid var(--line);background:var(--paper);
      border-radius:var(--rl) var(--rl) 0 0;box-shadow:none;
      padding:8px 20px 12px;position:relative;z-index:3}
.dock:before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px;background:linear-gradient(180deg,rgba(247,244,236,0),rgba(247,244,236,.95));pointer-events:none}
.gaprow{display:flex;align-items:center;gap:8px;padding:5px 0 5px 10px}
.gaprow i{width:1px;height:12px;background:#D8DFD9;flex:0 0 auto}
.gaprow i:last-child{flex:1;height:1px;background:repeating-linear-gradient(90deg,#D8DFD9 0 3px,transparent 3px 6px)}
.gaprow span{font-size:8.5px;letter-spacing:.1em;color:#8E9993;text-transform:uppercase}
.dockrow{display:flex;gap:10px}
.dbtn{flex:1;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);
      font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;user-select:none;
      line-height:1;transition:.12s}
.dbtn.solid{background:var(--green);color:#fff;border:1px solid var(--green)}
.dbtn.solid:active{background:var(--deep)}
.dbtn.ghost{background:#fff;color:var(--green);border:1px solid var(--green)}
.dbtn.ghost:active{background:var(--mint)}

/* ---------- 底部导航 ---------- */
nav{height:64px;flex:0 0 64px;background:var(--deep);display:flex;align-items:stretch;
    position:relative;z-index:3}
nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
         color:rgba(255,255,255,.6);cursor:pointer;transition:color .15s}
nav .tab svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.4;
             stroke-linecap:round;stroke-linejoin:round}
nav .tab i{display:block;width:14px;height:2px;background:transparent}
nav .tab .lab{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase}
nav .tab.on{color:#fff}
nav .tab.on i{background:#fff}

/* ---------- 注脚 ---------- */
.note{margin-top:auto;flex:0 0 auto;text-align:center;font-size:8.5px;color:var(--faint);
      letter-spacing:.06em;padding:4px 0;line-height:1.4}

/* ---------- 按钮 ---------- */
.btn{height:32px;padding:0 14px;border-radius:var(--r);font-size:11px;letter-spacing:.08em;background:var(--card);
     color:var(--green);border:1px solid var(--green);display:inline-flex;align-items:center;justify-content:center;
     line-height:1;cursor:pointer;user-select:none;text-transform:uppercase;transition:.12s}
.btn:active{background:var(--green);color:#fff}
.btn.state{color:var(--faint);border-color:var(--line);border-style:dashed;background:transparent;cursor:default}

/* ---------- toast ---------- */
#toast{position:absolute;left:20px;right:20px;top:80px;background:var(--card);border:1px solid var(--line);
       border-left:2px solid var(--green);border-radius:var(--r);padding:12px;font-size:11px;color:var(--ink);
       display:none;align-items:center;gap:10px;z-index:30;flex-wrap:wrap;line-height:1.5}
#toast b{font-weight:600;color:var(--deep)}
#toast .undo{margin-left:auto;color:var(--green);cursor:pointer;letter-spacing:.08em;font-weight:600;
             font-size:11px;text-transform:uppercase}
#toast .alt{color:var(--mute);cursor:pointer;font-size:8.5px;border-bottom:1px solid var(--line);letter-spacing:.04em}

/* ---------- 弹层 ---------- */
#veil{position:absolute;inset:0;background:rgba(0,56,44,.34);display:none;z-index:40}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:3px 3px 0 0;
       border-top:1px solid var(--line);padding:16px 20px 24px;display:none;z-index:41;max-height:78%;
       overflow-y:auto;scrollbar-width:none}
#sheet::-webkit-scrollbar{display:none}
#sheet h3{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;margin-bottom:12px;
          color:var(--deep);font-variant-numeric:tabular-nums;text-transform:uppercase}
.opt{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;
     cursor:pointer;transition:.12s}
.opt:active{background:var(--mint);border-color:var(--green)}
.opt .n{font-size:13.5px;font-weight:600;color:var(--deep);letter-spacing:.04em}
.opt .m{font-size:11px;color:var(--mute);margin-top:4px;letter-spacing:.03em}
.opt .w{font-size:8.5px;color:var(--faint);margin-top:4px;letter-spacing:.03em}
.sheetrow{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{font-size:11px;color:var(--mute);border:1px solid var(--line);background:var(--card);border-radius:var(--r);
      padding:12px;cursor:pointer;transition:.12s;letter-spacing:.03em}
.chip:active{background:var(--mint);border-color:var(--green);color:var(--green)}
textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;
         font-family:var(--sans);font-size:13.5px;color:var(--ink);resize:none;height:54px;outline:none}
textarea:focus{border-color:var(--green)}
h2{font-family:var(--serif);font-size:17px;font-weight:400;margin:0 0 8px;color:var(--deep);letter-spacing:.01em}
.sub{font-size:11px;color:var(--mute);margin-bottom:10px;line-height:1.6;letter-spacing:.02em}
.preview{border:1px solid var(--line);border-left:2px solid var(--green);background:var(--card);border-radius:var(--r);
         padding:12px;font-size:11px;line-height:1.8;margin-bottom:10px;display:none;
         font-variant-numeric:tabular-nums}
.row2{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);
      font-size:13.5px;letter-spacing:.02em}
.row2 .v{color:var(--mute);font-family:var(--serif);font-variant-numeric:tabular-nums}
.row2 .v input{width:56px;border:none;border-bottom:1px solid var(--line);background:transparent;font-family:var(--serif);
               font-size:13.5px;text-align:right;color:var(--deep);outline:none;font-variant-numeric:tabular-nums}
.row2 .v input:focus{border-bottom-color:var(--green)}
.learned{font-size:8.5px;color:var(--faint);margin-top:8px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.bounds{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute);padding:0 0 8px;letter-spacing:.03em}
.tappill{border-bottom:1px solid var(--green);padding-bottom:1px;color:var(--green);font-family:var(--serif);
         font-size:11px;cursor:pointer;font-variant-numeric:tabular-nums}
.tlist{max-height:300px;overflow-y:auto;margin:-4px -4px 0;scrollbar-width:none}
.tlist::-webkit-scrollbar{display:none}
.trow{display:flex;justify-content:space-between;gap:10px;padding:12px;font-size:13.5px;border-radius:var(--r);
      font-family:var(--sans);cursor:pointer;border:1px solid transparent;font-variant-numeric:tabular-nums;
      align-items:baseline;letter-spacing:.02em}
.trow:active{background:var(--mint)}
.trow.on{background:var(--mint);border-color:var(--green);font-weight:600;color:var(--deep)}
.tw{color:var(--faint);font-size:8.5px;letter-spacing:.03em}
.week{display:flex;gap:5px;margin:2px 0 10px}
.dcol{flex:1;text-align:center;cursor:pointer;padding:8px 0;border-radius:var(--r);transition:.12s;
      border:1px solid transparent}
.dcol.on{background:var(--card);border-color:var(--green)}
.dcol .dw{font-size:8.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.dcol .dn{font-size:13.5px;margin-top:3px;font-family:var(--serif);font-variant-numeric:tabular-nums;color:var(--deep)}
.dcol.on .dn{font-weight:600}
.dcol.on .dw{color:var(--green)}
.bars{display:flex;flex-direction:column;gap:2px;margin-top:6px;align-items:center;min-height:24px;justify-content:flex-end}
.bars i{display:block;height:4px;border-radius:0;background:var(--line);width:14px}
.bars i.k{background:#3F6E7A}
.bars i.s{background:#00664F}
.bars i.e{background:#5F6B65}
.bars i.m{background:#8E9993}
.dayhdr{font-size:8.5px;color:var(--mute);letter-spacing:.1em;margin-bottom:8px;text-transform:uppercase}
.dl{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px;cursor:pointer}
.dl .hh{width:40px;flex:0 0 40px;font-size:11px;color:var(--mute);font-family:var(--serif);padding-top:8px;
        font-variant-numeric:tabular-nums}
.dl .bx{flex:1;border-radius:var(--r);padding:8px 12px;font-size:11px;border:1px solid var(--line);background:var(--card);
        display:flex;align-items:baseline;gap:8px;transition:.12s}
.dl:active .bx{background:var(--mint);border-color:var(--green)}
.dl .bx b{font-weight:600;margin-left:auto;font-size:11px;color:var(--deep);letter-spacing:.04em}
.dl .bx .tm{font-family:var(--serif);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
#planBox{margin-top:auto;padding-top:8px}


/* 查找：嵌老前端 */
.findframe{width:100%;height:calc(100% - 4px);border:0;display:block;background:var(--paper)}

/* 查找（旧表单元件，保留备用） */
.fform{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:6px;
       background:var(--card);padding:12px;margin-bottom:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:9px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.fl select,.fl input{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--paper);
                     color:var(--ink);font-size:12px;padding:0 8px;font-family:var(--sans)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbtn{height:40px;display:flex;align-items:center;justify-content:center;border-radius:6px;
      background:var(--deep);color:var(--paper);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.ferr{margin:0;color:#a3312c;font-size:10px}
.fcount{margin:0 2px 8px;font-size:10px;letter-spacing:.06em;color:var(--faint)}
.frow{position:relative;display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px 8px 16px;
      border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:8px;cursor:pointer;overflow:hidden}
.fbar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.fcode{font-family:var(--serif);font-size:16px}
.fwhere{font-size:9px;color:var(--mute);margin-top:2px}
.fside{margin-left:auto;font-size:9px;color:var(--faint)}

/* 评价 */
.rt{margin:0;font-family:var(--serif);font-size:22px;font-weight:400}
.rs{margin:4px 0 10px;font-size:10px;color:var(--mute)}
.ritem{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:8px 10px;margin-bottom:8px}
.rrow{display:flex;justify-content:space-between;font-size:10px;color:var(--mute)}
.ritem p{margin:6px 0 0;font-size:11px;line-height:1.5;color:var(--ink)}
.rchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rchips span{font-size:9px;padding:2px 6px;border-radius:999px;background:var(--mint);color:var(--mute)}
.rphotos{display:flex;gap:6px;margin-top:6px}
.rphotos img{width:52px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.rform{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:6px;
       background:var(--card);padding:10px;margin-top:8px}
.rl{display:grid;grid-template-columns:92px 1fr 22px;align-items:center;gap:8px;font-size:10px;color:var(--mute)}
.rl input[type=range]{accent-color:var(--green)}
.rv{font-size:10px;text-align:right;color:var(--ink)}
.rform textarea{border:1px solid var(--line);border-radius:6px;background:var(--paper);font:inherit;
                font-size:11px;padding:6px 8px;color:var(--ink);resize:vertical}
.rfile{display:flex;gap:8px;align-items:center;font-size:9px;color:var(--mute)}
.rbtn{height:38px;display:flex;align-items:center;justify-content:center;border-radius:6px;
      background:var(--deep);color:var(--paper);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}

.askwrap{flex:0 0 auto;margin:2px 0 8px}
.ask{display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;height:42px;
  border:1px solid var(--line);border-radius:21px;background:#fff}
.ask input{font-size:12px}
.ask .send{width:28px;height:28px;font-size:13px}
.ex{display:flex;gap:6px;margin-top:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ex::-webkit-scrollbar{display:none}
.ex b{flex:0 0 auto;font-weight:400;font-size:9.5px;padding:4px 9px;border-radius:11px;
  border:1px solid var(--line);background:#fff;color:#6B655C;cursor:pointer;white-space:nowrap}
.ex b:active{background:var(--mint)}
.ex i{flex:0 0 auto;font-style:normal;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);display:flex;align-items:center}
.ask input{flex:1;border:0;background:transparent;font:inherit;font-size:11px;color:var(--ink);outline:none}
.ask input::placeholder{color:var(--faint)}
.ask .send{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--green);
  color:#F7F4EC;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ask.busy{opacity:.55}
</style></head><body>

/* ================= helpers ================= */
const main=document.getElementById('main');
const mins=t2=>{const [h,m]=t2.split(':').map(Number);return h*60+m;};
const Round5=m=>Math.round(m/5)*5;
function shift(t2,d){let x=mins(t2)+d;x=Math.max(0,x);
  return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');}
function r10(t2){const m=Math.round(mins(t2)/10)*10;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
const typeName=s=> s.type==='class'?t('typeClass') : s.type==='study'?t('typeStudy') :
                    s.type==='eat'?t('typeEat') : t('typeMeet');
const sortStops=()=>S.stops.sort((a,b)=>a.start.localeCompare(b.start));
const WALK=8;

function fillGaps(){
  sortStops();
  const live=S.stops.filter(s=>s.status!=='dropped'&&s.status!=='skipped');
  for(let i=1;i<live.length;i++){
    const prev=live[i-1],next=live[i];
    const free=mins(next.start)-mins(prev.end)-WALK;
    if(free<10) continue;
    if(prev.type==='study'||prev.type==='eat'){ prev.end=r10(shift(next.start,-WALK)); }
    else{
      const st=r10(shift(prev.end,WALK)), en=r10(shift(next.start,-WALK));
      if(mins(en)-mins(st)>=10) S.stops.push({id:nextId++,type:'study',start:st,end:en,place:'nearby',status:'planned'});
    }
  }
  sortStops();
  refreshGaps();
}

/* 只重算行走间隔，不动任何站点。撤回时用它，保证恢复到原样 */
function refreshGaps(){
  sortStops();
  const now=S.stops.filter(s=>s.status!=='dropped');
  S.gaps=[]; for(let i=1;i<now.length;i++){
    const w=Math.max(5,Math.round((mins(now[i].start)-mins(now[i-1].end))/5)*5);
    S.gaps.push('walk:'+w);
  }
}


/* ================= agent: 一句话，走同一批动作 =================
   模型只回答「调哪个工具、传什么」，计划由 runTool 改，和点按钮走同一条路。
   三个入口，按优先级：
     window.AGENT_ENDPOINT  真正的模型接口，POST {sentence, plan} → {calls:[{name,args}]}
     window.AGENT_PROXY     本地代理函数，测试用
     fallback               离线规则，只认几个演示句式
*/
const SENTENCES = [];

function snapshotStops(){ return JSON.stringify(S.stops); }
function restoreStops(json){
  S.stops = JSON.parse(json); refreshGaps(); render();
}

function findStop(a){
  if(!a) return null;
  const t = (a.stop != null) ? a.stop : (a.id != null ? a.id : a.start);
  if(t == null) return null;
  if(/^\d+$/.test(String(t))) return S.stops.find(s=>String(s.id)===String(t));
  if(TIME_OK.test(String(t))) return S.stops.find(s=>s.start===String(t) && s.status!=='dropped');
  return null;
}

/* 工具集 = 界面上能做的事。多一个少一个都要两边同时改。 */
const TOOLS = {
  read_plan(a){
    const list = S.stops.filter(s=>s.status!=='dropped')
      .map(s=>({id:s.id,start:s.start,end:s.end,type:s.type,place:s.place,status:s.status}));
    return {date:(a&&a.date)||'today', stops:list};
  },

  change_stop(a){
    const s=findStop(a);
    if(!s) return {error:'no such stop'};
    if(s.status==='done') return {error:'that block has passed'};
    const bs=s.start, be=s.end;
    if(a.shift) { s.start=r10(shift(s.start,a.shift)); s.end=r10(shift(s.end,a.shift)); }
    if(a.start) s.start=r10(a.start);
    if(a.end)   s.end=r10(a.end);
    if(a.place) { s.place=a.place; if(s.status==='todo') s.status='planned'; }
    if(mins(s.end)<=mins(s.start)){ s.start=bs; s.end=be; return {error:'end before start'}; }
    refreshGaps(); render();
    return {ok:true, stop:{start:s.start,end:s.end,type:s.type,place:s.place}};
  },

  add_stop(a){
    if(!a || !a.start) return {error:'start required'};
    const st=r10(a.start), en=r10(a.end||shift(a.start,30));
    if(mins(en)<=mins(st)) return {error:'end before start'};
    const id=nextId++;
    S.stops.push({id,type:a.type||'study',start:st,end:en,
                  place:a.place||'tbd',status:'planned',src:'self'});
    refreshGaps(); render();
    return {ok:true, id, start:st, end:en};
  },

  cancel_stop(a){
    const s=findStop(a);
    if(!s) return {error:'no such stop'};
    s.status='dropped'; refreshGaps(); render();
    return {ok:true, start:s.start};
  },

  skip_class(a){
    const s=findStop(a);
    if(!s) return {error:'no such stop'};
    if(s.type!=='class') return {error:'not a class'};
    s.status='skipped'; refreshGaps(); render();
    return {ok:true, start:s.start};
  },

  undo(){ return {error:'nothing to undo'} }
};

/* 白名单 + 参数校验。未知工具、坏时间一律不进执行体。 */
const TIME_OK = /^([01]\d|2[0-3]):[0-5]\d$/;

function checkArgs(name,a){
  a = a || {};
  if(name==='change_stop' || name==='cancel_stop' || name==='skip_class'){
    const t=(a.stop != null) ? a.stop : (a.id != null ? a.id : a.start);
    if(t == null) return 'needs stop';
    if(!/^\d+$/.test(String(t)) && !TIME_OK.test(String(t))) return 'bad stop';
  }
  if(name==='add_stop'){
    if(!a.start || !TIME_OK.test(a.start)) return 'bad start';
    if(a.end && !TIME_OK.test(a.end)) return 'bad end';
  }
  if(name==='change_stop'){
    if(a.start && !TIME_OK.test(a.start)) return 'bad start';
    if(a.end && !TIME_OK.test(a.end)) return 'bad end';
    if(a.shift != null && !Number.isFinite(a.shift)) return 'bad shift';
  }
  if(name==='read_plan' || name==='undo') return null;
  if(!TOOLS[name]) return 'unknown tool';
  return null;
}

function runTool(name,args){
  const bad=checkArgs(name,args);
  if(bad) return {error:bad};
  if(name==='undo'){ if(undoGroup){ restoreStops(undoGroup); undoGroup=null; return {ok:true}; } return {error:'nothing to undo'}; }
  return TOOLS[name](args||{});
}

/* 一句话解出的所有调用算一次改动，撤销一次全退 */
let undoGroup=null;

function runCalls(sentence, calls){
  const before=snapshotStops();
  const results=[];
  for(const c of calls){
    const r=runTool(c.name, c.args);
    results.push({name:c.name, args:c.args||{}, result:r});
    if(r && r.error) break;
  }
  SENTENCES.push({sentence, calls, results, source:'sentence', at:Date.now()});
  const ok = results.filter(r=>r.result && r.result.ok).length;
  if(ok){
    undoGroup=before;
    toast(describe(results), ()=>{ restoreStops(before); undoGroup=null; hideToast(); });
  } else {
    toast(t('askNo'));
  }
  return results;
}

function describe(results){
  const parts=[];
  for(const r of results){
    if(!r.result || r.result.error) continue;
    const s = r.result.stop || {};
    if(r.name==='change_stop') parts.push(t('askMoved',{b:(s.start||'')+'-'+(s.end||'')}));
    else if(r.name==='add_stop') parts.push(t('askAdded',{a:(s.start||r.result.start||'')}));
    else if(r.name==='cancel_stop') parts.push(t('askRemoved',{a:r.result.start||r.args.start||''}));
    else if(r.name==='skip_class') parts.push(t('askSkipped',{a:r.result.start||r.args.start||''}));
    else if(r.name==='undo') parts.push(t('askUndo'));
  }
  return parts.join(' · ') || t('askNo');
}

async function interpret(sentence){
  const plan = TOOLS.read_plan({date:'today'}).stops;
  if(window.AGENT_ENDPOINT){
    const res = await fetch(window.AGENT_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sentence, plan})
    });
    const data = await res.json();
    return (data.calls || []).slice(0,6);
  }
  if(typeof window.AGENT_PROXY==='function'){
    return (await window.AGENT_PROXY(sentence, plan) || []).slice(0,6);
  }
  return fallbackParse(sentence, plan);
}

/* 离线规则：没有接口时也能演示几句，认不出就老实说认不出 */
function fallbackParse(sentence, plan){
  const q = sentence.toLowerCase();
  const words = {one:13,two:14,three:15,four:16,five:17,six:18};   /* 下午的口语说法 */
  const times = [];
  (q.match(/\b\d{1,2}[:.]\d{2}\b/g) || []).forEach(x=>{
    const [h,m]=x.split(/[:.]/); times.push(String(h).padStart(2,'0')+':'+m);
  });
  const hw = q.match(/\b(one|two|three|four|five|six)\b/);
  if(hw && !times.length) times.push(String(words[hw[1]]).padStart(2,'0')+':00');

  const kind = /lunch|eat|food|饭/.test(q) ? 'eat'
             : /class|lecture|课/.test(q) ? 'class'
             : /meet|meeting|见面/.test(q) ? 'meet'
             : /study|自习/.test(q) ? 'study' : null;

  const pick = () => {
    if(times[0]){ const byTime=plan.find(x=>x.start===times[0]); if(byTime) return byTime; }
    if(kind){ const k=plan.filter(x=>x.type===kind && x.status!=='done'); if(k.length) return k[0]; }
    return null;
  };

  if(/cancel|remove|drop|取消|删/.test(q)){
    const s=pick(); return s ? [{name:'cancel_stop',args:{stop:s.start}}] : [];
  }
  if(/skip|不去|跳过/.test(q)){
    const s=pick(); return (s && s.type==='class') ? [{name:'skip_class',args:{stop:s.start}}] : [];
  }
  if(/move|push|shift|挪|改到|推到/.test(q) || (times.length>1 && kind==='study')){
    const s=pick();
    const to = times[1] || (times[0] && s && s.start!==times[0] ? times[0] : null);
    if(!s || !to) return [];
    const len = mins(s.end)-mins(s.start);
    return [{name:'change_stop',args:{stop:s.start,start:to,end:shift(to,len)}}];
  }
  return [];
}

async function askSend(given){
  const bar=document.getElementById('askBar'), el=document.getElementById('askIn');
  const q=String(given!=null ? given : (el && el.value) || '').trim();
  if(!q || !bar) return;
  if(el) el.value='';
  bar.classList.add('busy');
  let calls=[];
  try { calls = await interpret(q); } catch(e){ calls=[]; }
  bar.classList.remove('busy');
  if(!calls.length){ toast(t('askNo')); return; }
  runCalls(q, calls);
}

/* 演示时钟固定 11:20 */
const NOWMIN = 11*60 + 20;

/* 强弱：2 自习 · 3 上课 · 4 餐饮 · 5 自己加的 · 6 从日程表读进来的（金色留给焦点卡） */
function lvlOf(s){
  if(s.type==='study') return 2;
  if(s.type==='class') return 3;
  if(s.type==='eat') return 4;
  return s.src==='cal' ? 6 : 5;
}

/* 焦点站：11:20 正在进行的那间自习室 → NOW；否则之后最近的一间 → NEXT */
function focusPick(){
  const st=S.stops.filter(s=>s.type==='study' && s.status!=='dropped' && s.status!=='skipped');
  const cur=st.slice().sort((a,b)=>a.start.localeCompare(b.start))
              .filter(s=>mins(s.start)<=NOWMIN && NOWMIN<mins(s.end))[0];
  if(cur) return {s:cur, isNow:true};
  const nx=st.slice().sort((a,b)=>a.start.localeCompare(b.start))
             .filter(s=>mins(s.start)>NOWMIN)[0];
  return nx ? {s:nx, isNow:false} : null;
}
const WALKMIN = 5;   /* 演示：从这间自习室走到下一站是 5 分钟 */
function walkTo(s){
  const nx=S.stops.filter(x=>x.status!=='dropped' && x.status!=='skipped' &&
                             mins(x.start)>=mins(s.end))
                   .sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(!nx) return null;
  const gap=Math.max(0,Round5(mins(nx.start)-mins(s.end)));
  return Math.min(WALKMIN, gap || WALKMIN);
}
/* 三类色条：自习 = 绿 / 上课 = 灰蓝 / 其他（吃饭·见面·手动添加·日历导入）= 暖褐 */

function focusCard(f){

/* 下一间自习：当前那间之后的第一间，用来标 NEXT */
function studyNextId(){
  const f=focusPick();

    const after=S.stops.filter(s=>s.type==='study' && s.status!=='dropped' && s.status!=='done' && s.start>f.s.end)
                       .sort((a,b)=>a.start.localeCompare(b.start))[0];
    return after? after.id : null;
  }
  return f ? f.s.id : null;

function block(s,ctx){
  ctx=ctx||{};
  const oc='onclick="blockSheet('+s.id+',event)"';

    ? '<span class="tag doneTag">DONE</span>'

async function apiToken(){
  const saved = localStorage.getItem('ns.token');
  if(saved) return saved;
  const r = await fetch(API + '/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:'user1', password:'user123'}),
    signal: AbortSignal.timeout(3000)
  });
  if(!r.ok) throw new Error('login ' + r.status);
  const d = await r.json();
  localStorage.setItem('ns.token', d.token);
  return d.token;
}

async function apiReviews(code){
  const r = await fetch(API + '/api/rooms/' + encodeURIComponent(code) + '/reviews',
                        {signal:AbortSignal.timeout(3000)});
  if(!r.ok) throw new Error('reviews ' + r.status);
  return r.json();
}

const FIND = { building:'', date:fmtDay(new Date()), from:'09:00', to:'10:50',
               rooms:null, busy:false, error:'', buildings:[] };

function hh(from, i){ return String(from + i).padStart(2,'0') + ':00'; }
function toOpts(){ const a=[]; for(let i=9;i<=20;i++) a.push(String(i).padStart(2,'0')+':50'); return a; }

function renderFind(){
  /* 直接嵌老前端：查教室那张页面原样搬进来，数据由它自己调 /api */
  main.innerHTML = `<iframe class="findframe" src="http://localhost:5174/?embed=1#/find" title="Find a room"></iframe>`;
}

async function runFind(){
  if(FIND.busy) return;
  FIND.busy = true; FIND.error = ''; renderFind();
  try{
    if(!FIND.buildings.length) FIND.buildings = await apiBuildings();
    FIND.rooms = await apiFreeRooms(FIND.building, FIND.date, FIND.from, FIND.to);
  }catch(e){ FIND.error = t('findFailed') + ' · ' + e.message; FIND.rooms = null; }
  FIND.busy = false; renderFind();
}

const FACTORS = [['quiet','revQuiet'],['desk','revDesk'],['sockets','revSockets'],
                 ['aircon','revAircon'],['space','revSpace'],['light','revLight']];

function stars(key){
  return `<label class="rl"><span>${t(key)}</span>
    <input type="range" min="1" max="10" step="1" value="7"
           oninput="this.nextElementSibling.textContent=this.value">
    <b class="rv">7</b></label>`;
}

async function openReview(code){
  REVIEW = { code, list:null, rating:8, dims:{quiet:7,desk:7,sockets:7,aircon:7,space:7,light:7} };
  showSheet(`
    <h3 class="rt">${code}</h3>
    <p class="rs" id="revAvg">…</p>
    <div id="revList"></div>
    <div class="rform">
      ${stars('revOverall').replace('value="7"','value="8"').replace('>7<','>8<')}
      ${FACTORS.map(([k,key])=>stars(key).replace('oninput','data-k="'+k+'" oninput')).join('')}
      <textarea id="revBody" rows="3" placeholder="${t('revBody')}"></textarea>
      <label class="rfile"><input type="file" accept="image/*" multiple id="revPhoto">${t('revPhoto')}</label>
      <div class="rbtn" id="revGo" onclick="submitReview()">${t('revSave')}</div>
    </div>`);
  try{
    const d = await apiReviews(code);
    REVIEW.list = d;
    const el = document.getElementById('revAvg');
    if(el) el.textContent = d.count ? `${d.average} / 10 · ` + t('revCount',{n:d.count}) : t('revNone');
    const box = document.getElementById('revList');
    if(box){
      box.innerHTML = (d.items||[]).map(r=>`
        <div class="ritem">
          <div class="rrow"><b>${r.author}</b><span>${r.rating}/10</span></div>
          <p>${r.body}</p>
          ${r.dimensions?`<div class="rchips">${Object.entries(r.dimensions).map(([k,v])=>{
              const f=FACTORS.find(x=>x[0]===k); return `<span>${f?t(f[1]):k} ${v}</span>`;}).join('')}</div>`:''}
          ${(r.photos&&r.photos.length)?`<div class="rphotos">${r.photos.map(p=>`<img src="${API}${p.url}" alt="">`).join('')}</div>`:''}
        </div>`).join('');
    }
  }catch(e){
    const el = document.getElementById('revAvg'); if(el) el.textContent = e.message;
  }
}

async function submitReview(){
  const btn = document.getElementById('revGo');
  if(!btn || btn.dataset.busy) return;
  btn.dataset.busy = '1';
  const rating = Number(document.querySelector('.rform input[type=range]').value);
  const dims = {};
  document.querySelectorAll('.rform input[data-k]').forEach(el=>{ dims[el.dataset.k] = Number(el.value); });
  const body = document.getElementById('revBody').value.trim();
  try{
    const token = await apiToken();
    const r = await fetch(API + '/api/rooms/' + encodeURIComponent(REVIEW.code) + '/reviews', {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token},
      body: JSON.stringify({ rating, body, dimensions: dims })
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.message || ('review ' + r.status));
    const files = document.getElementById('revPhoto').files;
    for(const f of Array.from(files).slice(0,3)){
      const form = new FormData(); form.append('file', f);
      await fetch(API + '/api/reviews/' + data.id + '/photos', {
        method:'POST', headers:{ Authorization:'Bearer ' + token }, body: form });
    }
    closeSheet();
    toast(t('revSaved'));
    await openReview(REVIEW.code);
  }catch(e){
    btn.textContent = e.message;
    btn.dataset.busy = '';
  }
}

/* ================= toast / sheet ================= */
let toastTimer=null;
function toast(msg,undoCb,altCb,altText){
  const el=document.getElementById('toast');
  el.innerHTML=`<span>${msg}</span>`+(altCb?`<span class="alt" id="altBtn">${altText}</span>`:'')+
               (undoCb?`<span class="undo" id="undoBtn">${t('undo')}</span>`:'');
  el.style.display='flex';
  if(undoCb) document.getElementById('undoBtn').onclick=()=>{hideToast();undoCb();};
  if(altCb) document.getElementById('altBtn').onclick=()=>{hideToast();altCb();};
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,6000);
}
const hideToast=()=>document.getElementById('toast').style.display='none';
function showSheet(html){const s=document.getElementById('sheet'),v=document.getElementById('veil');
  s.innerHTML=html;s.style.display='block';v.style.display='block';}
function closeSheet(){document.getElementById('sheet').style.display='none';document.getElementById('veil').style.display='none';}
document.getElementById('veil').onclick=closeSheet;

/* ================= actions ================= */
/* ================= 块操作单 =================
   【限制选择 Hick】每个块只开一张单，单内最多 7 项（上课：跳过 / 换地点 / 提前30 / 提前15 / 推后15 / 推后30 / 删掉）
   【防错与可恢复】单里的每一项执行后都跟 undo，绝不"一键不可逆" */
function blockSheet(id,ev){
  if(ev&&ev.target.closest('.btn,.act')) return;
  if(ev) ev.stopPropagation();
  const s=S.stops.find(x=>x.id===id);
  if(!s) return;
  if(s.status==='done'){ toast(t('pastToast')); return; }   /* 过去的格子只给反馈，不给改 */
  const L=lvlOf(s);
  /* 只有餐饮这两样：改时间、删掉 */
  if(s.type==='eat'){
    showSheet('<h3>'+s.start+'–'+s.end+' &middot; '+typeName(s)+'</h3><div class="tlist">'+
      '<div class="trow" onclick="timeSheet('+id+')">'+t('editTime')+'<span class="tw">'+s.start+'</span></div>'+
      '<div class="trow" onclick="dropStop('+id+')">'+t('removeItem')+'</div></div>'+
      '<div class="sheetrow"><span class="btn" onclick="closeSheet()">'+t('cancel')+'</span></div>');
    return;
  }
  let rows='';
  if(s.type==='class'){
    rows='<div class="trow" onclick="skipStop('+id+')">'+t('skipThis')+'<span class="tw">'+t('skipNote')+'</span></div>'+
      '<div class="trow" onclick="swapStop('+id+')">'+t('changePlace')+'<span class="tw">'+P(s.place)+'</span></div>'+
      [[-30,'moveEarlier'],[-15,'moveEarlier15'],[15,'moveLater15'],[30,'moveLater']].map(([d,k])=>
        '<div class="trow" onclick="moveStop('+id+','+d+')">'+t(k)+'<span class="tw">'+shift(s.start,d)+'</span></div>').join('');
  } else if(s.type==='study'){
    rows='<div class="trow" onclick="swapStop('+id+')">'+t('swap')+'<span class="tw">'+P(s.place)+'</span></div>'+
      [[-15,'moveEarlier15'],[15,'moveLater15']].map(([d,k])=>
        '<div class="trow" onclick="moveStop('+id+','+d+')">'+t(k)+'<span class="tw">'+shift(s.start,d)+'</span></div>').join('');
  } else {
    /* 见面的时间由对方定，这里只保留一步：删掉 */
    rows='';
  }
  rows+='<div class="trow" onclick="dropStop('+id+')">'+t('removeItem')+'</div>';
  showSheet('<h3>'+s.start+'–'+s.end+' &middot; '+typeName(s)+'</h3><div class="tlist">'+rows+'</div>'+
    '<div class="sheetrow"><span class="btn" onclick="closeSheet()">'+t('cancel')+'</span></div>');
}
function timeSheet(id){
  const s=S.stops.find(x=>x.id===id);
  showSheet('<h3>'+s.start+'–'+s.end+' &middot; '+t('editTime')+'</h3><div class="tlist">'+
    [[-30,'moveEarlier'],[-15,'moveEarlier15'],[15,'moveLater15'],[30,'moveLater']].map(([d,k])=>
      '<div class="trow" onclick="moveStop('+id+','+d+')">'+t(k)+'<span class="tw">'+shift(s.start,d)+'</span></div>').join('')+
    '</div><div class="sheetrow"><span class="btn" onclick="closeSheet()">'+t('cancel')+'</span></div>');
}
function planRow(start){
  const s=S.stops.find(x=>x.start===start);
  if(s){ blockSheet(s.id); return; }
  const r=(WEEK[selDay].rows||[]).find(x=>x[0]===start);
  if(r) showSheet(`<h3>${r[0]}–${r[1]} · ${typeLabel(r[2])}</h3>`+
    `<div class="tlist"><div class="trow">${P(r[3])}<span style="color:#9A9285">${WEEK[selDay].label[LANG]||WEEK[selDay].label.en}</span></div></div>`+
    `<div class="sheetrow"><span class="btn" onclick="closeSheet()">${t('close')}</span></div>`);
}
function swapStop(id){
  const s=S.stops.find(x=>x.id===id);
  const pool=s.type==='eat' ? EAT_POOL : ['kb221','kb315','lib3f','chihwah','cym'];
  showSheet(`<h3>${s.start} · ${t('swap')}</h3>`+
    pool.slice(eatIdx,eatIdx+3).map(k=>
      `<div class="opt" onclick="pickSwap(${id},'${k}')"><div class="n">${P(k)}</div>
       <div class="m">8 min · ${LANG==='en'?'same campus':'同区'}</div>
       <div class="w">${LANG==='en'?'free for the whole block':'整段都空着'}</div></div>`).join('')+
    `<div class="sheetrow"><span class="btn" onclick="nextBatch(${id})">${t('swap')}</span>
     <span class="btn" onclick="closeSheet()">${t('cancel')}</span></div>`);
}
function nextBatch(id){ batchCount++; if(batchCount>2){ closeSheet(); batchCount=0; return; }
  eatIdx=(eatIdx+3)%EAT_POOL.length; swapStop(id); }
function pickSwap(id,place){
  const s=S.stops.find(x=>x.id===id);
  const before=s.place;
  s.place=place; if(s.status==='todo') s.status='planned';
  fillGaps(); closeSheet(); render();
  toast(t('swapped',{p:P(place)}),()=>{s.place=before;fillGaps();render();hideToast();});
}
function bookStop(id){
  const s=S.stops.find(x=>x.id===id);
  s.booking='booking'; render();
  setTimeout(()=>{ s.booking='done'; s.place='room2'; s.status='planned'; render();
    toast(t('bookedToast'),()=>{s.booking='none';s.place='kb221';render();hideToast();}); },800);
}
/* 【防错与可恢复】取消预约也能撤回：恢复成"已预约 / LIB 3/F R2" */
function unbook(id){
  const s=S.stops.find(x=>x.id===id); const bp=s.place;
  s.booking='none'; s.place='tbd'; render();
  toast(t('unbookToast'),()=>{s.booking='done';s.place=bp||'room2';render();hideToast();});
}
function skipStop(id){
  const s=S.stops.find(x=>x.id===id); const before=s.status;
  s.status='skipped'; fillGaps(); sortStops(); render();
  toast(t('skipped'),()=>{s.status=before;fillGaps();render();hideToast();});
}
function moveStop(id,d){
  const s=S.stops.find(x=>x.id===id); const bs=s.start,be=s.end;
  s.start=r10(shift(s.start,d)); s.end=r10(shift(s.end,d));
  fillGaps(); closeSheet(); render();
  toast(`${s.start}–${s.end}`,()=>{s.start=bs;s.end=be;fillGaps();render();hideToast();});
}
function dropStop(id){
  const s=S.stops.find(x=>x.id===id); const before=s.status;
  s.status='dropped'; fillGaps(); closeSheet(); render();
  toast(t('removeItem'),()=>{s.status=before;fillGaps();render();hideToast();});
}
function endDay(){ S.ended=true; render(); toast(t('endedToast'),()=>{S.ended=false;render();hideToast();}); }
function unEnd(){ S.ended=false; render(); hideToast(); }
function extend(){
  const last=S.stops[S.stops.length-1]; const before=last.end;
  last.end='18:50'; render();
  toast(t('extended',{t:'18:50'}),()=>{last.end=before;render();hideToast();});
}
function applyDeviation(lateMin){
  closeSheet();
  const now=S.stops.find(x=>x.status==='now')||S.stops[1];
  const before=now.end;
  now.end=r10(shift(now.end,-lateMin));
  render();
  toast(t('repairToast',{t:now.end}),()=>{now.end=before;render();hideToast();},
        ()=>{now.end=before;fullRecompute(lateMin);},t('seeRecompute'));
}
function fullRecompute(d){
  const idx=S.stops.findIndex(x=>x.status==='now'); let n=0;
  for(let i=idx;i<S.stops.length;i++){ if(i>idx) S.stops[i].start=shift(S.stops[i].start,-d);
    S.stops[i].end=shift(S.stops[i].end,-d); n++; }
  render(); toast(t('recomputeToast',{n}),()=>location.reload());
}
function pickTime(which){
  const cur=which==='start'?S.started:S.ends;
  const list=[]; let x='07:00'; while(mins(x)<=mins('23:00')){ list.push(x); x=shift(x,30); }
  showSheet(`<h3>${which==='start'?t('startAt'):t('endAt')}</h3><div class="tlist">`+
    list.map(v=>`<div class="trow ${v===cur?'on':''}" onclick="setBound('${which}','${v}')">${v}</div>`).join('')+
    `</div><div class="sheetrow"><span class="btn" onclick="closeSheet()">${t('cancel')}</span></div>`);
}
function setBound(which,v){ closeSheet(); if(which==='start')S.started=v; else S.ends=v; render(); }
function addSheet(){
  showSheet(`<h3>${t('addTitle')}</h3><div class="tlist">`+
    [['study','typeStudy'],['eat','typeEat'],['meet','typeMeet'],['class','typeClass']].map(([k,lab])=>
      `<div class="trow ${addType===k?'on':''}" onclick="addType='${k}';addSheet()">${t(lab)}</div>`).join('')+

      <input id="aStart" value="13:00" style="flex:1;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-family:inherit;font-size:13.5px">
      <input id="aEnd" value="14:00" style="flex:1;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-family:inherit;font-size:13.5px"></div>
     <div class="sheetrow"><span class="btn" onclick="doAdd()">${t('add')}</span>
     <span class="btn" onclick="closeSheet()">${t('cancel')}</span></div>`);
}
function doAdd(){
  const st=document.getElementById('aStart').value, en=document.getElementById('aEnd').value;
  const pl=addType==='study'?'nearby':addType==='eat'?'cym':'tbd';
  S.stops.push({id:nextId++,type:addType,start:st,end:en,place:pl,status:'planned',src:'self'});
  fillGaps(); closeSheet(); render();
  setTimeout(()=>toast(t('addToast',{t:st+'–'+en}),()=>{S.stops.pop();fillGaps();render();hideToast();}),20);
}
